<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Költség Kezelő - Ottó Legénybúcsúja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Extra styling for buttons to ensure they work */
        .btn-clickable {
            cursor: pointer;
            user-select: none;
        }
        .btn-clickable:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 text-white min-h-screen">
    
    <!-- Navigation -->
    <nav class="fixed top-0 w-full bg-black/30 backdrop-blur-md z-50 border-b border-white/10">
        <div class="container mx-auto px-4 md:px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-lg md:text-xl font-bold hover:text-purple-400 transition">← Vissza</a>
            <h1 class="text-sm md:text-lg font-semibold">💰 Költség Kezelő</h1>
            <button id="add-expense-btn-header" class="btn-clickable px-3 md:px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-500 rounded-lg font-semibold hover:opacity-90 transition flex items-center gap-2 text-sm">
                <span class="text-lg md:text-xl">+</span>
                <span class="hidden md:inline">Új Költség</span>
            </button>
        </div>
    </nav>

    <div class="container mx-auto px-4 pt-24 pb-32 max-w-4xl">
        
        <!-- HERO SECTION WITH BIG BUTTON -->
        <div class="mb-8 text-center bg-gradient-to-r from-purple-900/30 to-pink-900/30 rounded-2xl p-6 md:p-8 border border-purple-500/20">
            <h2 class="text-2xl md:text-3xl font-bold mb-3 md:mb-4">Költségek Nyomon Követése</h2>
            <p class="text-sm md:text-base text-gray-300 mb-4 md:mb-6">Töltsd fel a számlákat és oszd szét a költségeket könnyen!</p>
            <button id="add-expense-btn-top" class="btn-clickable inline-flex items-center gap-2 md:gap-3 px-6 md:px-8 py-3 md:py-4 bg-gradient-to-r from-purple-500 to-pink-500 rounded-xl text-white font-bold text-base md:text-lg shadow-lg hover:shadow-2xl transition-all duration-300 hover:scale-105">
                <span class="text-xl md:text-2xl">➕</span>
                <span>Új Költség Hozzáadása</span>
            </button>
        </div>

        <!-- Balance Dashboard -->
        <section id="balance-dashboard" class="mb-8">
            <div class="bg-white/5 backdrop-blur-lg rounded-2xl border border-white/10 p-4 md:p-6">
                <h2 class="text-xl md:text-2xl font-bold mb-4 flex items-center gap-2">
                💰 Összes Egyenleg
                </h2>
                <div id="balance-list" class="space-y-4">
                    <div class="text-center text-gray-400 py-8">
                        <p>Még nincsenek költségek. Add hozzá az elsőt fent! 👆</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Settlement Suggestions -->
        <section id="settlement-section" class="mb-8 hidden">
            <div class="bg-gradient-to-r from-green-900/30 to-emerald-900/30 backdrop-blur-lg rounded-2xl border border-green-500/20 p-4 md:p-6">
                <h3 class="text-lg md:text-xl font-bold mb-4 flex items-center gap-2">
                    💡 Legegyszerűbb Elszámolás
                </h3>
                <div id="settlement-list" class="space-y-2">
                    <!-- Settlement suggestions will be inserted here -->
                </div>
            </div>
        </section>

        <!-- Expense List -->
        <section id="expense-list-section" class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl md:text-2xl font-bold">📋 Összes Költség</h2>
                <div class="flex gap-2">
                    <button id="export-btn" class="px-3 md:px-4 py-2 bg-white/10 rounded-lg hover:bg-white/20 transition text-xs md:text-sm">
                        📊 Exportálás
                    </button>
                </div>
            </div>
            <div id="expense-list" class="space-y-4">
                <!-- Expense cards will be inserted here -->
            </div>
        </section>

    </div>

    <!-- Floating Add Button -->
    <button id="add-expense-btn" class="btn-clickable fixed bottom-24 right-6 w-14 h-14 md:w-16 md:h-16 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full shadow-lg hover:shadow-2xl transition-all duration-300 flex items-center justify-center text-2xl md:text-3xl z-50 hover:scale-110">
        +
    </button>

    <!-- Add Expense Modal -->
    <div id="expense-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-gray-900 rounded-2xl border border-white/10 p-4 md:p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 md:mb-6">
                <h3 class="text-xl md:text-2xl font-bold">➕ Új Költség Hozzáadása</h3>
                <button id="close-modal-btn" class="text-3xl hover:text-red-400 transition">&times;</button>
            </div>

            <form id="expense-form" class="space-y-4">
                
                <!-- Bill Photo Upload -->
                <div>
                    <label class="block text-sm font-medium mb-2">📸 Számla Fotó (opcionális)</label>
                    <input type="file" id="bill-photo" accept="image/*" capture="environment" 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white text-sm">
                    <div id="photo-preview" class="mt-2 hidden">
                        <img id="preview-img" class="w-full max-h-48 object-contain rounded-lg border border-white/10">
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-medium mb-2">📝 Leírás</label>
                    <input type="text" id="description" required placeholder="pl. Ebéd az U Fleků-nál"
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500">
                </div>

                <!-- Amount -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">💶 Összeg</label>
                        <input type="number" id="amount" required step="0.01" placeholder="0.00"
                               class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">💱 Pénznem</label>
                        <select id="currency" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white">
                            <option value="EUR">EUR (€)</option>
                            <option value="CZK">CZK (Kč)</option>
                        </select>
                    </div>
                </div>

                <!-- Category -->
                <div>
                    <label class="block text-sm font-medium mb-2">🏷️ Kategória</label>
                    <select id="category" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white">
                        <option value="food">🍽️ Étel & Ital</option>
                        <option value="accommodation">🏠 Szállás</option>
                        <option value="transport">🚕 Utazás</option>
                        <option value="activities">🎉 Programok</option>
                        <option value="gifts">🎁 Ajándékok</option>
                        <option value="other">💊 Egyéb</option>
                    </select>
                </div>

                <!-- Who Paid -->
                <div>
                    <label class="block text-sm font-medium mb-2">👤 Ki Fizette?</label>
                    <select id="paid-by" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white">
                        <option value="">Válassz...</option>
                    </select>
                </div>

                <!-- Split Between -->
                <div>
                    <label class="block text-sm font-medium mb-2">👥 Kik Között Osztjuk? (válaszd ki ki volt ott)</label>
                    <div id="split-between-list" class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto p-2 bg-white/5 rounded-lg border border-white/10">
                        <!-- Checkboxes will be populated here -->
                    </div>
                    <button type="button" id="select-all-btn" class="mt-2 text-sm text-purple-400 hover:text-purple-300">
                        Mindenkit Kiválaszt
                    </button>
                </div>

                <input type="hidden" id="split-type" value="equal">

                <!-- Buttons -->
                <div class="flex gap-4 pt-4">
                    <button type="submit" class="flex-1 px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-500 rounded-lg font-semibold hover:opacity-90 transition">
                        💾 Költség Mentése
                    </button>
                    <button type="button" id="cancel-btn" class="px-6 py-3 bg-white/10 rounded-lg hover:bg-white/20 transition">
                        Mégse
                    </button>
                </div>
            </form>
        </div>
    </div>

     <!-- Detail Modal - INSERT HERE! -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] items-center justify-center p-4">
        <div class="bg-gradient-to-br from-gray-900 to-gray-800 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-white/10 shadow-2xl">
            <div id="detail-content" class="p-6 md:p-8"></div>
        </div>
    </div>

    <!-- Firebase & Scripts -->
    <script type="module" src="expenses.js"></script>
    
    <!-- Backup inline script to ensure buttons work -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, checking buttons...');
            
            // Check if buttons exist
            const btnTop = document.getElementById('add-expense-btn-top');
            const btnHeader = document.getElementById('add-expense-btn-header');
            const btnFloat = document.getElementById('add-expense-btn');
            
            console.log('Top button:', btnTop);
            console.log('Header button:', btnHeader);
            console.log('Float button:', btnFloat);
            
            // If expenses.js hasn't loaded yet, add temporary listeners
            setTimeout(() => {
                const modal = document.getElementById('expense-modal');
                
                const openModal = () => {
                    console.log('Opening modal...');
                    if (modal) {
                        modal.classList.remove('hidden');
                        modal.classList.add('flex');
                    }
                };
                
                if (btnTop && !btnTop.onclick) {
                    btnTop.addEventListener('click', openModal);
                }
                if (btnHeader && !btnHeader.onclick) {
                    btnHeader.addEventListener('click', openModal);
                }
                if (btnFloat && !btnFloat.onclick) {
                    btnFloat.addEventListener('click', openModal);
                }
            }, 100);
        });
    </script>
</body>
</html>
